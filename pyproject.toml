[project]
name = "netswitch"
version = "0.2.0"
description = "Save network profiles (IP, gateway, DNS) and switch between them quickly"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[project.gui-scripts]
netswitch = "netswitch.__main__:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["netswitch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
