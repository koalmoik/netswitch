# Builds dist\NetSwitch.exe (same steps as build_windows.bat) and the installer
# dist\NetSwitch-Setup.exe (installer.nsi) on a Windows runner.
# Every push: both are available as a downloadable artifact of the run.
# Pushing a tag like v0.2.0: both are also attached to a GitHub release.
name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to create releases for tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e .[dev]

      - name: Test
        run: python -m pytest -q

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --uac-admin --name NetSwitch run_netswitch.py

      - name: Build installer
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsis\makensis.exe")) { choco install nsis -y --no-progress }
          $version = python -c "import netswitch; print(netswitch.__version__)"
          & "$nsis\makensis.exe" "/DVERSION=$version" installer.nsi

      - uses: actions/upload-artifact@v7
        with:
          name: NetSwitch-windows
          path: |
            dist/NetSwitch.exe
            dist/NetSwitch-Setup.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/NetSwitch.exe
            dist/NetSwitch-Setup.exe
